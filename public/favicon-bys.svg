<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Before You Send">
  <!-- Favicon / app-icon: simplified typing-bubble mark (no tail — crisp at 16-32px),
       three dots holding B · Y · S. -->
  <rect x="3" y="6" width="58" height="46" rx="16" fill="#1e4236"/>
  <circle cx="18" cy="29" r="9.5" fill="#faf7f1"/>
  <circle cx="32" cy="29" r="9.5" fill="#faf7f1"/>
  <circle cx="46" cy="29" r="9.5" fill="#faf7f1"/>
  <text x="18" y="29" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1e4236">B</text>
  <text x="32" y="29" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1e4236">Y</text>
  <text x="46" y="29" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1e4236">S</text>
</svg>
